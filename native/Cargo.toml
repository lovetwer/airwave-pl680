[package]
name = "airwave"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "airwave-native"
path = "src/main.rs"

[dependencies]
slint = { version = "1", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "std", "unstable-fontique-011", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "ogg", "vorbis", "isomp4"] }
cpal = "0.15"
ureq = "2"

[build-dependencies]
slint-build = "1"
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
